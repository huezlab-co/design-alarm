<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>디자인 작업 알림</title>
<style>html,body{margin:0;height:100%;background:#f6f2ec;overflow:hidden}#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}</style></head>
<body><iframe id="app" allow="clipboard-read; clipboard-write; downloads"></iframe>
<script>
// 윈도우 프로그램 창 안 액자: 웹앱을 iframe으로 띄워 구글 맨 위 띠가 안 나오게(웹앱 주소는 프로그램이 # 뒤로 넘김, 서버로 안 감)
const h = new URLSearchParams(location.hash.slice(1)), d = h.get('u') || '';
if (/^AKfy[\w-]{20,120}$/.test(d)) document.getElementById('app').src = 'https://script.google.com/macros/s/' + d + '/exec' + (h.get('t') === '1' ? '?test=1' : '');
</script></body></html>
