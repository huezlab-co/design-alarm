<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>(주)휴즈랩 디자인</title>
<style>html,body{margin:0;height:100%;background:#f6f2ec;overflow:hidden}#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}</style></head>
<body><iframe id="app" allow="clipboard-read; clipboard-write; downloads"></iframe>
<script>
/* 윈도우 프로그램 창 안 액자: 웹앱을 iframe으로 띄워 구글 맨 위 띠가 안 나오게(웹앱 주소는 # 뒤로 받음, 서버로 안 감)
 * 웹앱 ↔ 프로그램 사이 말 전달: 웹앱이 postMessage로 로그인 정보를 알려 주면 프로그램(hzDesk)에 넘기고,
 * 프로그램이 「작업 열기·새로고침」을 시키면 웹앱에 postMessage로 넘김(폰 앱과 같은 약속) */
const h = new URLSearchParams(location.hash.slice(1)), d = h.get('u') || '';
const APP_ORIGIN = /^https:\/\/[\w-]+-script\.googleusercontent\.com$/;
const frame = document.getElementById('app');
if (/^AKfy[\w-]{20,120}$/.test(d)) frame.src = 'https://script.google.com/macros/s/' + d + '/exec' + (h.get('t') === '1' ? '?test=1' : '');
function tellApp(msg) { const walk = w => { try { w.postMessage(msg, '*'); } catch (e) {} try { for (let i = 0; i < w.frames.length; i++) walk(w.frames[i]); } catch (e) {} }; try { walk(frame.contentWindow); } catch (e) {} }
window.addEventListener('message', e => { const m = e.data; if (!m || m.hz !== 'tok' || !APP_ORIGIN.test(e.origin)) return; if (window.hzDesk) hzDesk.login(m); });
if (window.hzDesk) { hzDesk.onOpen(id => tellApp({ hz: 'open', id: id })); hzDesk.onWake(() => tellApp({ hz: 'wake' })); }
frame.addEventListener('load', () => { [800, 2500, 6000].forEach(t => setTimeout(() => tellApp({ hz: 'hello' }), t)); });
</script></body></html>
