<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>(주)휴즈랩 디자인 — 설치</title>
<link rel="icon" href="icon-192.png">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f2ec; color: #2b241d; font-family: "Malgun Gothic", system-ui, sans-serif; }
  .card { width: min(380px, 90vw); background: #fff; border-radius: 22px; box-shadow: 0 10px 30px rgba(60,40,20,.08); padding: 40px 32px 30px; text-align: center; box-sizing: border-box; }
  .card img { width: 72px; height: 72px; }
  h1 { font-size: 24px; margin: 16px 0 28px; }
  .btn { display: block; background: #e8783a; color: #fff; text-decoration: none; font-size: 18px; font-weight: 700; border-radius: 14px; padding: 15px; }
  .btn:hover { background: #d96a2c; }
  .btn.off { background: #c9bfb5; pointer-events: none; }
  .ver { font-size: 13px; color: #9a9087; margin-top: 10px; }
  .tip { font-size: 13px; color: #8a7f75; margin-top: 22px; line-height: 1.5; }
  .tip b { color: #5d544b; }
</style>
</head>
<body>
<div class="card">
  <img src="icon-192.png" alt="">
  <h1>(주)휴즈랩 디자인</h1>
  <a class="btn off" id="dl" href="#">불러오는 중…</a>
  <div class="ver" id="ver"></div>
  <div class="tip">설치 중 「PC 보호」 창이 뜨면 <b>추가 정보 → 실행</b></div>
</div>
<script>
// 항상 최신 설치 파일로 연결(버전이 바뀌어도 이 주소는 그대로)
fetch('update/latest.yml?' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(t => {
  const p = (/^path:\s*(.+)$/m.exec(t) || [])[1], v = (/^version:\s*(.+)$/m.exec(t) || [])[1];
  if (!p) throw new Error();
  const a = document.getElementById('dl'); a.href = 'update/' + p.trim(); a.textContent = '설치하기'; a.className = 'btn'; a.setAttribute('download', '');
  document.getElementById('ver').textContent = '윈도우용 · 버전 ' + (v || '').trim();
}).catch(() => { const a = document.getElementById('dl'); a.textContent = '잠시 뒤 다시 열어 주세요'; });
</script>
</body>
</html>
