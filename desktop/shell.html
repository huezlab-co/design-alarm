<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>(주)휴즈랩 디자인</title>
<style>html,body{margin:0;height:100%;background:#f6f2ec;overflow:hidden}#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}</style></head>
<body><iframe id="app" allow="clipboard-read; clipboard-write; downloads"></iframe>
<script>
// 웹앱을 액자(iframe) 안에 띄움 — 구글이 맨 위에 붙이는 「Apps Script 사용자가 만든 앱」 띠가 안 나옴
const u = new URLSearchParams(location.search).get('u') || '';
if (/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec(\?test=1)?$/.test(u) || /^http:\/\/127\.0\.0\.1:\d+\/exec(\?test=1)?$/.test(u)) document.getElementById('app').src = u;
</script></body></html>
